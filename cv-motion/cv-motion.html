<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>CV Motion</title>
<style>
  html, body { margin: 0; background: #06070d; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ====== CONTENU (à personnaliser) ======
const PROFILE = {
  first: 'ENZO',
  last: 'GALLINA',
  tagline: '> Créatif · Tech · Intelligence Artificielle',
  tags: ['#IA', '#TECH', '#GAMING', '#POKÉMON'],
  skills: [['Intelligence Artificielle', 96], ['Développement', 90], ['Créativité', 94], ['Curiosité', 100]],
  radar: [['IA', .95], ['CODE', .86], ['DESIGN', .8], ['GAMING', .98], ['CURIOSITÉ', 1], ['ÉQUIPE', .88]],
  contact: 'enzo.gallina71@gmail.com',
};

const W = 1920, H = 1080, DUR = 15;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const C = { bg: '#06070d', cyan: '#00e5ff', mag: '#ff2e88', yel: '#ffd23f', red: '#ff3b4e', white: '#f4f6ff', ink: '#0b0d18' };
const DISPLAY = '"Inter Display", Inter, sans-serif';
const MONO = '"JetBrains Mono", monospace';

// ====== OUTILS ======
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function font(w, s, f = DISPLAY) { ctx.font = `${w} ${s}px ${f}`; }
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; }

// Particules de fond
const PARTS = (() => { const r = rng(7), a = [];
  for (let i = 0; i < 160; i++) a.push({ x: r() * W, y: r() * H, s: 20 + r() * 90, z: .4 + r() * 1.6, c: [C.cyan, C.mag, C.yel, C.white][Math.floor(r() * 4)], ph: r() * 6.28 });
  return a; })();

// Grain
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
(() => { const g = grain.getContext('2d'), d = g.createImageData(256, 256), r = rng(3);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; }
  g.putImageData(d, 0, 0); })();
const grainPat = ctx.createPattern(grain, 'repeat');

// ====== ÉLÉMENTS RÉCURRENTS ======
function background(t, gridAmt) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * .5, H * .45, 50, W * .5, H * .5, W * .75);
  const hue = Math.sin(t * .4) * .5 + .5;
  g.addColorStop(0, `rgba(${lerp(40, 90, hue)},${lerp(20, 10, hue)},${lerp(110, 80, hue)},0.55)`);
  g.addColorStop(1, 'rgba(6,7,13,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Sol synthwave
  if (gridAmt > 0) {
    const hy = H * .64;
    const lg = ctx.createLinearGradient(0, hy, 0, H); lg.addColorStop(0, 'rgba(255,46,136,0)'); lg.addColorStop(.35, 'rgba(255,46,136,1)');
    ctx.save(); ctx.globalAlpha = .22 * gridAmt; ctx.strokeStyle = lg; ctx.lineWidth = 1.5;
    for (let i = -24; i <= 24; i++) { ctx.beginPath(); ctx.moveTo(W / 2 + i * 18, hy); ctx.lineTo(W / 2 + i * 260, H + 40); ctx.stroke(); }
    for (let k = 0; k < 14; k++) {
      const z = ((k + (t * 1.2) % 1) / 14); const y = hy + Math.pow(z, 2.4) * (H - hy + 60);
      ctx.globalAlpha = .22 * gridAmt * z; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();
  }

  // Particules montantes
  for (const p of PARTS) {
    const y = ((p.y - t * p.s * p.z) % H + H) % H;
    const x = p.x + Math.sin(t * .8 + p.ph) * 14;
    ctx.globalAlpha = .25 + .35 * (Math.sin(t * 3 + p.ph) * .5 + .5);
    ctx.fillStyle = p.c; ctx.fillRect(x, y, 2.2 * p.z, 2.2 * p.z);
  }
  ctx.globalAlpha = 1;
}

const SCENES = [['INTRO', 0, 2.5], ['ID', 2.5, 6], ['STATS', 6, 9.5], ['PASSIONS', 9.5, 12.5], ['QUEST', 12.5, 15]];
function hud(t, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  const m = 56, L = 46;
  ctx.strokeStyle = 'rgba(244,246,255,.55)'; ctx.lineWidth = 3;
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke(); });

  font(500, 20, MONO); ctx.textBaseline = 'middle';
  ctx.fillStyle = C.red; if (Math.floor(t * 2) % 2 === 0) { ctx.beginPath(); ctx.arc(m + 30, m + 30, 7, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(244,246,255,.8)'; ctx.textAlign = 'left';
  ctx.fillText('REC   PLAYER_01 // CV.EXE', m + 50, m + 31);
  ctx.textAlign = 'right';
  const fr = Math.floor((t % 1) * 60), s = Math.floor(t);
  ctx.fillText(`TC 00:00:${String(s).padStart(2, '0')}:${String(fr).padStart(2, '0')}`, W - m - 26, m + 31);

  // Barre de progression + chapitres
  const bx = 220, bw = W - 440, by = H - m - 26;
  ctx.fillStyle = 'rgba(244,246,255,.15)'; ctx.fillRect(bx, by, bw, 3);
  const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0); pg.addColorStop(0, C.cyan); pg.addColorStop(1, C.mag);
  ctx.fillStyle = pg; ctx.fillRect(bx, by, bw * (t / DUR), 3);
  font(600, 15, MONO); ctx.textAlign = 'left';
  SCENES.forEach(([n, a]) => { const x = bx + bw * a / DUR, on = t >= a;
    ctx.fillStyle = on ? C.white : 'rgba(244,246,255,.35)'; ctx.fillRect(x, by - 6, 2, 15);
    ctx.fillText(n, x + 8, by - 16); });
  ctx.restore();
}

function overlays(t) {
  // scanlines
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  // grain
  const r = rng(Math.floor(t * 60) + 11);
  ctx.save(); ctx.translate(-r() * 256, -r() * 256); ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .72);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

// Volets diagonaux tricolores ; l'écran est entièrement couvert à tc
function wipe(t, tc) {
  const cols = [C.mag, C.cyan, C.yel, C.ink], d = .62, bw = W * 1.9, sk = 420;
  const para = (x, w, c) => { ctx.fillStyle = c; ctx.beginPath();
    ctx.moveTo(x + sk, 0); ctx.lineTo(x + w + sk, 0); ctx.lineTo(x + w, H); ctx.lineTo(x, H); ctx.closePath(); ctx.fill(); };
  cols.forEach((c, i) => {
    const t0 = tc - d / 2 - (cols.length - 1 - i) * .045;
    const p = prog(t, t0, t0 + d);
    if (p <= 0 || p >= 1) return;
    const x = lerp(W + sk, -bw - sk, E.inOutExpo(p));
    para(x, bw, c);
    // liserés colorés sur le bord de fuite du dernier volet
    if (c === C.ink) { para(x + bw, 26, C.yel); para(x + bw + 26, 14, C.cyan); para(x + bw + 40, 8, C.mag); }
  });
}

// Texte qui monte lettre par lettre derrière un masque
function riseText(str, x, y, size, weight, t, t0, opt = {}) {
  const { stg = .045, dur = .7, align = 'left', fill = C.white, stroke = null, ls = 0, from = 1.1 } = opt;
  font(weight, size); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const ws = [...str].map(ch => ctx.measureText(ch).width + ls);
  const total = ws.reduce((a, b) => a + b, 0) - ls;
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.save(); ctx.beginPath(); ctx.rect(cx - 40, y - size * 1.05, total + 80, size * 1.35); ctx.clip();
  [...str].forEach((ch, i) => {
    const p = E.outExpo(prog(t, t0 + i * stg, t0 + i * stg + dur));
    const dy = (1 - p) * size * from;
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.strokeText(ch, cx, y + dy); }
    if (fill) { ctx.fillStyle = fill; ctx.fillText(ch, cx, y + dy); }
    cx += ws[i];
  });
  ctx.restore();
  return total;
}

function typeText(str, x, y, size, t, t0, cps, color, align = 'left') {
  const n = Math.floor(clamp((t - t0) * cps, 0, str.length));
  if (t < t0) return;
  font(500, size, MONO); ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = color;
  const s = str.slice(0, n); ctx.fillText(s, x, y);
  if (Math.floor(t * 3) % 2 === 0 || n < str.length) {
    const w = ctx.measureText(s).width, cx = align === 'center' ? x + w / 2 : x + w;
    ctx.fillStyle = C.cyan; ctx.fillRect(cx + 6, y - size * .8, size * .55, size * .95);
  }
}

// Texte glitch RGB tranché
function glitchText(str, x, y, size, weight, t, amt) {
  font(weight, size); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const r = rng(Math.floor(t * 24) * 13 + 5), sl = 10, top = y - size * .7, bot = y + size * .7;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let sy = top; sy < bot; sy += sl) {
    const off = r() < amt ? (r() - .5) * 120 * amt : 0, ab = 3 + amt * 14;
    ctx.save(); ctx.beginPath(); ctx.rect(0, sy, W, sl); ctx.clip();
    ctx.fillStyle = 'rgba(0,229,255,.9)'; ctx.fillText(str, x + off - ab, y);
    ctx.fillStyle = 'rgba(255,46,136,.9)'; ctx.fillText(str, x + off + ab, y);
    ctx.fillStyle = 'rgba(244,246,255,.75)'; ctx.fillText(str, x + off, y);
    ctx.restore();
  }
  ctx.restore();
}

function ball(x, y, r, rot, topFill = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#f4f6ff'; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.fill();
  if (topFill > 0) {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, Math.PI * 2); ctx.clip();
    const g = ctx.createLinearGradient(0, -r, 0, 0); g.addColorStop(0, '#ff5a6a'); g.addColorStop(1, '#d81f3a');
    ctx.fillStyle = g; ctx.fillRect(-r, -r * topFill, r * 2, r * topFill); ctx.restore();
  }
  ctx.fillStyle = C.ink; ctx.fillRect(-r, -r * .09, r * 2, r * .18);
  ctx.strokeStyle = C.ink; ctx.lineWidth = r * .07; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(0, 0, r * .3, 0, 7); ctx.fill();
  ctx.fillStyle = '#f4f6ff'; ctx.beginPath(); ctx.arc(0, 0, r * .19, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-r * .4, -r * .55, r * .2, r * .1, -.6, 0, 7); ctx.fill();
  ctx.restore();
}

function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

// ====== SCÈNE 1 : INTRO ======
function scene1(t) {
  const cx = W / 2, cy = H / 2 - 40;
  const zoom = 1 + E.inExpo(prog(t, 1.95, 2.5)) * 22;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(zoom, zoom); ctx.translate(-cx, -cy);

  // Anneaux d'onde de choc
  for (let i = 0; i < 4; i++) {
    const p = prog(t, .75 + i * .1, 1.9 + i * .1);
    if (p > 0 && p < 1) { ctx.strokeStyle = [C.cyan, C.mag, C.yel, C.white][i]; ctx.globalAlpha = (1 - p) * .8;
      ctx.lineWidth = 3 + (1 - p) * 8; ctx.beginPath(); ctx.arc(cx, cy, 130 + E.outExpo(p) * 1100, 0, 7); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;

  // Ligne horizontale (la "bande")
  const lp = E.outExpo(prog(t, .7, 1.3));
  if (lp > 0) { glow(C.cyan, 20); ctx.fillStyle = C.white; ctx.fillRect(cx - lp * W * .6, cy - 2, lp * W * 1.2, 4); noGlow(); }

  const r = 130 * E.outBack(prog(t, .1, .7));
  const fillP = E.outCubic(prog(t, .9, 1.35));
  if (r > 0) {
    if (fillP > 0) {
      ctx.save(); ctx.globalAlpha = fillP; ball(cx, cy, r, Math.sin(t * 9) * .12 * prog(t, 1.4, 1.6) * (1 - prog(t, 1.8, 2)), fillP); ctx.restore();
    }
    const a = E.inOutCubic(prog(t, .05, .8)) * Math.PI * 2;
    glow(C.cyan, 30); ctx.strokeStyle = C.cyan; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(cx, cy, r + 14, -Math.PI / 2, -Math.PI / 2 + a); ctx.stroke(); noGlow();
    // tirets tournants
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 1.5); ctx.setLineDash([6, 18]); ctx.strokeStyle = 'rgba(244,246,255,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r + 44, 0, 7); ctx.stroke(); ctx.restore();
  }
  ctx.restore();

  if (t < 1.95) {
    const amt = t < 1.65 ? 1 - prog(t, 1.2, 1.65) * .85 : .12;
    const show = prog(t, 1.15, 1.25);
    if (show > 0) { ctx.globalAlpha = show; glitchText('PLAYER 1 — READY', cx, cy + 270, 84, 900, t, amt); ctx.globalAlpha = 1; }
    if (t > .2 && t < 1.15 && Math.floor(t * 5) % 2 === 0) {
      font(600, 26, MONO); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(244,246,255,.75)'; ctx.fillText('PRESS START', cx, cy + 270);
    }
    font(500, 20, MONO); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(244,246,255,.5)';
    ctx.globalAlpha = prog(t, 1.3, 1.5); ctx.fillText('CHARGEMENT DU PROFIL ▸▸▸', cx, cy + 340); ctx.globalAlpha = 1;
  }
}

// ====== SCÈNE 2 : IDENTITÉ ======
function scene2(t) {
  const x0 = 170;
  typeText('// IDENTIFICATION', x0, 235, 28, t, 2.6, 40, C.cyan);
  riseText(PROFILE.first, x0 - 8, 455, 250, 900, t, 2.7, { ls: -6 });
  const w2 = riseText(PROFILE.last, x0 - 8, 695, 250, 900, t, 2.9, { ls: -6, fill: null, stroke: C.cyan });
  // remplissage balayé de GALLINA
  const fp = E.inOutCubic(prog(t, 3.5, 4.2));
  if (fp > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(x0 - 20, 435, (w2 + 40) * fp, 300); ctx.clip();
    const g = ctx.createLinearGradient(x0, 0, x0 + w2, 0); g.addColorStop(0, C.mag); g.addColorStop(1, C.yel);
    riseText(PROFILE.last, x0 - 8, 695, 250, 900, 99, 0, { ls: -6, fill: g });
    ctx.restore();
    ctx.fillStyle = C.white; ctx.fillRect(x0 - 20 + (w2 + 40) * fp, 475, 4, 240 * (fp < 1 ? 1 : 0));
  }
  // barre d'accent
  const bp = E.outExpo(prog(t, 3.3, 4));
  const bg = ctx.createLinearGradient(x0, 0, x0 + 760, 0); bg.addColorStop(0, C.cyan); bg.addColorStop(1, C.mag);
  ctx.fillStyle = bg; ctx.fillRect(x0, 735, 760 * bp, 8);

  typeText(PROFILE.tagline, x0, 815, 38, t, 3.7, 38, C.white);
  PROFILE.tags.forEach((tag, i) => {
    const p = E.outBack(prog(t, 4.5 + i * .12, 4.95 + i * .12)); if (p <= 0) return;
    font(700, 24, MONO); const tw = ctx.measureText(tag).width + 36, ty = 860;
    const tx = x0 + PROFILE.tags.slice(0, i).reduce((acc, g) => acc + ctx.measureText(g).width + 56, 0);
    ctx.save(); ctx.translate(tx + tw / 2, ty + 22); ctx.scale(p, p); ctx.translate(-tx - tw / 2, -ty - 22);
    ctx.strokeStyle = [C.cyan, C.mag, C.yel, C.red][i]; ctx.lineWidth = 2; rrect(tx, ty, tw, 44, 22); ctx.stroke();
    ctx.fillStyle = C.white; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(tag, tx + 18, ty + 23);
    ctx.restore();
  });

  // Badge niveau à droite
  const cx = 1480, cy = 530, bpop = E.outElastic(prog(t, 3.0, 4.1));
  ctx.save(); ctx.translate(cx, cy); ctx.scale(bpop, bpop);
  for (let i = 0; i < 3; i++) {
    ctx.save(); ctx.rotate(t * (i % 2 ? -.6 : .9) + i); ctx.setLineDash([[40, 14], [4, 12], [120, 30]][i]);
    ctx.strokeStyle = [C.mag, 'rgba(244,246,255,.5)', C.cyan][i]; ctx.lineWidth = [4, 2, 3][i];
    ctx.beginPath(); ctx.arc(0, 0, 230 + i * 34, 0, 7); ctx.stroke(); ctx.restore();
  }
  ctx.rotate(Math.sin(t * 1.3) * .05);
  const hex = (rad) => { ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 - Math.PI / 2; ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad); } ctx.closePath(); };
  hex(190); const hg = ctx.createLinearGradient(0, -190, 0, 190); hg.addColorStop(0, 'rgba(0,229,255,.22)'); hg.addColorStop(1, 'rgba(255,46,136,.22)');
  ctx.fillStyle = hg; ctx.fill(); glow(C.cyan, 30); ctx.strokeStyle = C.cyan; ctx.lineWidth = 5; ctx.stroke(); noGlow();
  font(700, 34, MONO); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.cyan; ctx.fillText('LVL', 0, -80);
  const lvl = Math.round(99 * E.outCubic(prog(t, 3.4, 4.6)));
  font(900, 150); ctx.fillStyle = C.white; glow(C.mag, 40); ctx.fillText(String(lvl), 0, 20); noGlow();
  font(600, 22, MONO); ctx.fillStyle = 'rgba(244,246,255,.7)'; ctx.fillText('CLASSE : CRÉATEUR', 0, 112);
  ctx.restore();
}

// ====== SCÈNE 3 : STATS ======
function scene3(t) {
  const x0 = 170;
  typeText('// CHARACTER SHEET', x0, 215, 28, t, 6.1, 40, C.cyan);
  riseText('COMPÉTENCES', x0 - 4, 320, 110, 900, t, 6.15, { ls: -2, stg: .03 });

  PROFILE.skills.forEach(([name, val], i) => {
    const y = 430 + i * 135, t0 = 6.5 + i * .17, a = E.outCubic(prog(t, t0 - .15, t0 + .2));
    const p = E.outCubic(prog(t, t0, t0 + 1.3)), bw = 820, n = 24, sw = bw / n;
    ctx.globalAlpha = a;
    font(700, 34); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = C.white; ctx.fillText(name, x0, y);
    font(700, 34, MONO); ctx.textAlign = 'right';
    const done = p >= 1 && val >= 100;
    ctx.fillStyle = done ? C.yel : C.cyan; ctx.fillText(done ? 'MAX ★' : String(Math.round(val * p)), x0 + bw, y);
    for (let k = 0; k < n; k++) {
      const on = (k + 1) / n <= (val / 100) * p + 1e-6, f = k / (n - 1);
      ctx.fillStyle = on ? `rgb(${lerp(0, 255, f)},${lerp(229, 46, f)},${lerp(255, 136, f)})` : 'rgba(244,246,255,.1)';
      if (on) glow(ctx.fillStyle, 14);
      ctx.fillRect(x0 + k * sw, y + 22, sw - 7, 30); noGlow();
    }
    if (done) { const fl = 1 - prog(t, t0 + 1.3, t0 + 1.8); ctx.fillStyle = `rgba(255,210,63,${fl * .6})`; ctx.fillRect(x0 - 6, y + 16, bw + 12, 42); }
    ctx.globalAlpha = 1;
  });

  // Radar
  const cx = 1460, cy = 590, R = 280, N = PROFILE.radar.length;
  const pt = (k, rr) => { const a = k / N * Math.PI * 2 - Math.PI / 2; return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]; };
  const gp = E.outExpo(prog(t, 6.3, 7.1));
  ctx.strokeStyle = 'rgba(244,246,255,.18)'; ctx.lineWidth = 2;
  for (let l = 1; l <= 4; l++) { ctx.beginPath(); for (let k = 0; k <= N; k++) ctx.lineTo(...pt(k % N, R * l / 4 * gp)); ctx.stroke(); }
  for (let k = 0; k < N; k++) { ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(...pt(k, R * gp)); ctx.stroke(); }
  // balayage radar
  if (gp > 0) {
    const sa = t * 2.6;
    ctx.save(); ctx.beginPath(); for (let k = 0; k <= N; k++) ctx.lineTo(...pt(k % N, R * gp)); ctx.clip();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R * 1.2 * gp, sa - .7, sa); ctx.closePath();
    const sg = ctx.createConicGradient(sa - .7, cx, cy); sg.addColorStop(0, 'rgba(0,229,255,0)'); sg.addColorStop(.11, 'rgba(0,229,255,.28)');
    ctx.fillStyle = sg; ctx.fill(); ctx.restore();
  }
  const vp = E.outElastic(prog(t, 7.0, 8.4));
  if (vp > 0) {
    ctx.beginPath(); PROFILE.radar.forEach(([, v], k) => ctx.lineTo(...pt(k, R * v * vp))); ctx.closePath();
    ctx.fillStyle = 'rgba(255,46,136,.28)'; ctx.fill(); glow(C.mag, 24); ctx.strokeStyle = C.mag; ctx.lineWidth = 4; ctx.stroke(); noGlow();
    PROFILE.radar.forEach(([, v], k) => { const [x, y] = pt(k, R * v * vp); ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(x, y, 8, 0, 7); ctx.fill(); });
  }
  font(700, 24, MONO); ctx.textBaseline = 'middle';
  PROFILE.radar.forEach(([n], k) => { const a = prog(t, 6.8 + k * .06, 7.1 + k * .06); ctx.globalAlpha = a;
    const [x, y] = pt(k, R + 50); ctx.textAlign = Math.abs(x - cx) < 5 ? 'center' : x > cx ? 'left' : 'right';
    ctx.fillStyle = k % 2 ? C.cyan : C.white; ctx.fillText(n, x, y); });
  ctx.globalAlpha = 1;
}

// ====== SCÈNE 4 : PASSIONS ======
function neural(x, y, t, s) {
  const layers = [3, 4, 4, 2], nodes = layers.map((n, li) => Array.from({ length: n }, (_, i) => [x + (li - 1.5) * 90 * s, y + (i - (n - 1) / 2) * 62 * s]));
  ctx.lineWidth = 1.5;
  for (let li = 0; li < layers.length - 1; li++) nodes[li].forEach((a, i) => nodes[li + 1].forEach((b, j) => {
    ctx.strokeStyle = 'rgba(0,229,255,.25)'; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
    const f = (t * 1.4 + i * .37 + j * .23 + li * .5) % 1;
    ctx.fillStyle = C.cyan; ctx.globalAlpha = Math.sin(f * Math.PI); ctx.beginPath(); ctx.arc(lerp(a[0], b[0], f), lerp(a[1], b[1], f), 3.5, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }));
  nodes.flat().forEach(([nx, ny], k) => { const pu = .5 + .5 * Math.sin(t * 5 + k);
    glow(C.cyan, 18 * pu); ctx.fillStyle = C.ink; ctx.strokeStyle = C.cyan; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(nx, ny, 13 * s, 0, 7); ctx.fill(); ctx.stroke(); noGlow();
    ctx.fillStyle = `rgba(0,229,255,${pu})`; ctx.beginPath(); ctx.arc(nx, ny, 6 * s, 0, 7); ctx.fill(); });
}
function controller(x, y, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 2.2) * .06);
  ctx.fillStyle = '#1a1c30'; ctx.strokeStyle = C.mag; ctx.lineWidth = 4; glow(C.mag, 22);
  ctx.beginPath(); ctx.roundRect(-160, -70, 320, 120, 55);
  ctx.moveTo(-60, 40); ctx.arc(-110, 40, 58, 0, 7); ctx.moveTo(168, 40); ctx.arc(110, 40, 58, 0, 7);
  ctx.fill(); noGlow();
  ctx.beginPath(); ctx.roundRect(-160, -70, 320, 120, 55); ctx.stroke();
  ctx.fillStyle = C.white; ctx.fillRect(-122, -22, 56, 18); ctx.fillRect(-103, -41, 18, 56);
  const cols = [C.yel, C.cyan, C.red, '#4dff8c'], pos = [[90, -48], [124, -13], [90, 22], [56, -13]], hit = Math.floor(t * 5) % 4;
  pos.forEach(([bx, by], i) => { const on = i === hit; if (on) glow(cols[i], 26);
    ctx.fillStyle = on ? cols[i] : cols[i] + '88'; ctx.beginPath(); ctx.arc(bx, by, on ? 15 : 13, 0, 7); ctx.fill(); noGlow(); });
  ctx.fillStyle = '#2b2e48'; [[-45, 38], [45, 38]].forEach(([sx, sy]) => { ctx.beginPath(); ctx.arc(sx + Math.sin(t * 4) * 4, sy, 20, 0, 7); ctx.fill(); });
  ctx.restore();
}
function scene4(t) {
  typeText('// INVENTAIRE', W / 2, 165, 28, t, 9.6, 40, C.cyan, 'center');
  riseText('PASSIONS', W / 2, 270, 110, 900, t, 9.65, { align: 'center', stg: .035, ls: 4 });

  const cards = [
    ['01', 'IA', 'Explorer le futur', C.cyan],
    ['02', 'JEUX VIDÉO', 'Gamer depuis toujours', C.mag],
    ['03', 'POKÉMON', 'Attrapez-les tous !', C.yel],
  ];
  cards.forEach(([idx, title, sub, col], i) => {
    const t0 = 9.8 + i * .16, p = E.outBack(prog(t, t0, t0 + .7)), a = prog(t, t0, t0 + .25);
    if (a <= 0) return;
    const cx = 480 + i * 480, cy = 575, cw = 420, ch = 470;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy + (1 - p) * 220 + Math.sin(t * 2 + i) * 6); ctx.rotate((1 - p) * (i - 1) * .15); ctx.scale(.85 + .15 * p, .85 + .15 * p);
    const cg = ctx.createLinearGradient(0, -ch / 2, 0, ch / 2); cg.addColorStop(0, 'rgba(255,255,255,.07)'); cg.addColorStop(1, 'rgba(255,255,255,.015)');
    rrect(-cw / 2, -ch / 2, cw, ch, 26); ctx.fillStyle = cg; ctx.fill();
    glow(col, 26); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke(); noGlow();
    // reflet balayé
    const sh = prog(t, t0 + .5, t0 + 1.2);
    if (sh > 0 && sh < 1) { ctx.save(); rrect(-cw / 2, -ch / 2, cw, ch, 26); ctx.clip();
      const sx = lerp(-cw, cw, sh); const sg = ctx.createLinearGradient(sx - 80, 0, sx + 80, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.5, 'rgba(255,255,255,.25)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg; ctx.fillRect(-cw / 2, -ch / 2, cw, ch); ctx.restore(); }
    font(700, 22, MONO); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = col; ctx.fillText(idx, -cw / 2 + 28, -ch / 2 + 46);
    ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(244,246,255,.4)'; ctx.fillText('★★★', cw / 2 - 28, -ch / 2 + 46);

    if (i === 0) neural(0, -55, t, 1);
    if (i === 1) controller(0, -60, t);
    if (i === 2) { const lt = t - (t0 + .4);
      const wob = lt > 0 && lt < 1.5 ? Math.sin(lt * 14) * .35 * Math.max(0, 1 - lt / 1.5) : 0;
      ball(0, -55, 95, wob, 1);
      const sp = prog(t, t0 + 1.9, t0 + 2.4);
      if (sp > 0 && sp < 1) for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rr = 110 + E.outExpo(sp) * 60;
        ctx.fillStyle = `rgba(255,210,63,${1 - sp})`; ctx.save(); ctx.translate(Math.cos(a) * rr, -55 + Math.sin(a) * rr); ctx.rotate(a + Math.PI / 4); ctx.fillRect(-6, -6, 12, 12); ctx.restore(); }
    }
    font(900, 50); ctx.textAlign = 'center'; ctx.fillStyle = C.white; ctx.fillText(title, 0, 140);
    font(500, 24, MONO); ctx.fillStyle = 'rgba(244,246,255,.7)'; ctx.fillText(sub, 0, 186);
    ctx.restore();
  });

  const words = [['DÉCOUVRIR.', C.cyan], ['CRÉER.', C.mag], ['INNOVER.', C.yel]];
  words.forEach(([w, col], i) => {
    const t0 = 11.0 + i * .3, p = E.outBack(prog(t, t0, t0 + .4)); if (p <= 0) return;
    const x = 560 + i * 400, y = 895;
    ctx.save(); ctx.translate(x, y); ctx.scale(p, p); font(900, 62); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    glow(col, 30); ctx.fillStyle = col; ctx.fillText(w, 0, 0); noGlow(); ctx.restore();
  });
}

// ====== SCÈNE 5 : QUÊTE ======
let BURST = (() => { const r = rng(42), a = []; for (let i = 0; i < 90; i++) a.push({ a: r() * 6.283, v: 300 + r() * 900, s: 4 + r() * 10, c: [C.cyan, C.mag, C.yel, C.white][i % 4], spin: r() * 10 }); return a; })();
function scene5(t) {
  const cx = W / 2;
  // bandeau
  const bp = E.outExpo(prog(t, 12.65, 13.15));
  if (bp > 0) {
    ctx.save(); ctx.translate(cx, 250); ctx.rotate(-.03); ctx.scale(bp, 1);
    ctx.fillStyle = C.yel; ctx.fillRect(-W * .32, -38, W * .64, 76); ctx.restore();
    ctx.save(); ctx.globalAlpha = prog(t, 13.0, 13.2); ctx.translate(cx, 250); ctx.rotate(-.03);
    font(800, 38, MONO); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = C.ink;
    ctx.fillText('★  NOUVELLE QUÊTE DÉBLOQUÉE  ★', 0, 2); ctx.restore();
  }
  riseText('Prêt pour la', cx, 470, 120, 900, t, 12.8, { align: 'center', stg: .025 });
  const g = ctx.createLinearGradient(cx - 520, 0, cx + 520, 0); g.addColorStop(0, C.cyan); g.addColorStop(.5, C.mag); g.addColorStop(1, C.yel);
  riseText('prochaine quête.', cx, 610, 120, 900, t, 12.95, { align: 'center', stg: .025, fill: g });

  // barre d'XP
  const bw = 1000, bx = cx - bw / 2, by = 700, xp = E.inOutCubic(prog(t, 13.15, 14.0));
  const ba = prog(t, 13.0, 13.2); ctx.globalAlpha = ba;
  font(700, 26, MONO); ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left'; ctx.fillStyle = C.cyan; ctx.fillText('XP', bx, by - 14);
  ctx.textAlign = 'right'; ctx.fillStyle = C.white; ctx.fillText(`${Math.round(xp * 1000)} / 1000`, bx + bw, by - 14);
  rrect(bx, by, bw, 34, 17); ctx.fillStyle = 'rgba(244,246,255,.1)'; ctx.fill(); ctx.strokeStyle = 'rgba(244,246,255,.4)'; ctx.lineWidth = 2; ctx.stroke();
  if (xp > 0) { const xg = ctx.createLinearGradient(bx, 0, bx + bw, 0); xg.addColorStop(0, C.cyan); xg.addColorStop(1, C.yel);
    rrect(bx + 4, by + 4, (bw - 8) * xp, 26, 13); ctx.fillStyle = xg; glow(C.yel, 24); ctx.fill(); noGlow(); }
  ctx.globalAlpha = 1;

  // LEVEL UP
  const lp = prog(t, 14.0, 14.5);
  if (lp > 0) {
    const fl = 1 - prog(t, 14.0, 14.25); ctx.fillStyle = `rgba(255,255,255,${fl * .55})`; ctx.fillRect(0, 0, W, H);
    BURST.forEach(b => { const d = E.outExpo(prog(t, 14.0, 14.9)) * b.v, al = 1 - prog(t, 14.3, 15);
      ctx.save(); ctx.globalAlpha = al; ctx.translate(cx + Math.cos(b.a) * d, 815 + Math.sin(b.a) * d * .7); ctx.rotate(b.spin * t);
      ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 2, b.s, b.s); ctx.restore(); });
    const s = E.outElastic(lp);
    ctx.save(); ctx.translate(cx, 815); ctx.scale(s, s); ctx.rotate(-.04);
    font(900, 110); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.mag; ctx.fillText('LEVEL UP!', 6, 6); glow(C.yel, 40); ctx.fillStyle = C.yel; ctx.fillText('LEVEL UP!', 0, 0); noGlow();
    ctx.restore();
  }
  ctx.globalAlpha = prog(t, 14.25, 14.5);
  font(500, 30, MONO); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = 'rgba(244,246,255,.85)';
  ctx.fillText('✉  ' + PROFILE.contact, cx, 925);
  ctx.globalAlpha = 1;
}

// ====== RENDU ======
function shake(t) {
  let s = 0; [[2.5, 26], [14.0, 22]].forEach(([t0, a]) => { const d = t - t0; if (d >= 0 && d < .5) s += a * Math.exp(-d * 9); });
  return [Math.sin(t * 93) * s, Math.cos(t * 71) * s];
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; noGlow();
  const grid = t < 2.5 ? prog(t, .3, 1.5) * .6 : t < 12.5 ? .35 : .9;
  background(t, grid);
  const [sx, sy] = shake(t); ctx.save(); ctx.translate(sx, sy);
  if (t < 2.5) scene1(t);
  else if (t < 6) scene2(t);
  else if (t < 9.5) scene3(t);
  else if (t < 12.5) scene4(t);
  else scene5(t);
  ctx.restore();
  // flash d'entrée scène 2
  const fl = 1 - prog(t, 2.5, 2.9); if (t >= 2.5 && fl > 0) { ctx.fillStyle = `rgba(255,255,255,${E.inOutCubic(fl)})`; ctx.fillRect(0, 0, W, H); }
  [6, 9.5, 12.5].forEach(tc => wipe(t, tc));
  hud(t, prog(t, .4, .9));
  overlays(t);
  const fo = prog(t, 14.75, 15); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
}
window.render = render;
window.ready = Promise.all([
  document.fonts.load(`900 100px ${DISPLAY}`), document.fonts.load(`700 30px ${DISPLAY}`),
  document.fonts.load(`500 30px ${MONO}`), document.fonts.load(`800 30px ${MONO}`),
]);
// Aperçu live dans le navigateur
if (!location.search.includes('capture')) {
  const start = performance.now();
  (function loop() { render(((performance.now() - start) / 1000) % DUR); requestAnimationFrame(loop); })();
}
</script>
